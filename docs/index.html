<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theberly 文案產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--muted:#6b7785;--line:#e3e7ec;--accent:#2f6f5e;--accent-weak:#e6f1ed;--warn:#b54708;--warn-bg:#fff4e5;--red:#c62828;--red-bg:#fde7e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}
#who{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}
main{max-width:960px;margin:20px auto;padding:0 16px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:16px;margin:0 0 12px}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:8px}
tr.sel td{background:var(--accent-weak)}
button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:#fff}
button.small{padding:3px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
dl{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;margin:0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;white-space:pre-wrap}
.badge{display:inline-block;font-size:12px;border-radius:4px;padding:1px 7px;margin-right:6px;background:var(--accent-weak);color:var(--accent)}
.badge.warn{background:var(--red-bg);color:var(--red)}
.pending{color:var(--red);font-weight:700}
.set{border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px}
.set .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.field{margin-top:8px}
.field .lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.field .txt{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:4px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
#status{font-size:14px;color:var(--warn)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
<h1>theberly 文案產生器</h1>
<div id="who" class="hidden"><span id="whoName"></span><button class="small" id="logoutBtn">登出</button></div>
</header>
<main>
<section id="loginBox">
<h2>登入</h2>
<p class="muted">請用總表「人員」分頁登記的 Google 帳號登入。</p>
<div id="gbtn"></div>
<p id="loginMsg" style="color:var(--red)"></p>
</section>

<section id="clientsBox" class="hidden">
<h2>我的客戶</h2>
<p class="muted" id="adminNote"></p>
<table><thead><tr><th>客戶</th><th>Meta 負責</th><th>Google 負責</th><th>確認者</th><th>工作 Sheet</th><th></th></tr></thead><tbody id="clientRows"></tbody></table>
</section>

<section id="workBox" class="hidden">
<h2 id="curName"></h2>
<div id="noSheet" class="muted hidden">這個客戶還沒有工作 Sheet，請 Keani 或 Kimberly 先建立。</div>
<div id="clientDetail">
<p class="muted"><a id="sheetLink" target="_blank" rel="noopener">開啟工作 Sheet ↗</a>　要修改語氣、賣點、禁用字，請到工作 Sheet 的「設定」分頁</p>
<dl id="settings"></dl>
<p class="muted" id="refInfo"></p>
<h2 style="margin-top:20px">填寫需求</h2>
<div class="grid2">
<div><label class="f" for="q_pf">平台</label><select id="q_pf"><option>Meta</option><option disabled>Google（即將支援）</option></select></div>
<div><label class="f" for="q_fmt">格式</label><select id="q_fmt"><option>Meta 廣告</option><option disabled>Google 搜尋 RSA（即將支援）</option><option disabled>Google PMax（即將支援）</option></select></div>
<div><label class="f" for="q_act">活動名稱</label><input id="q_act" list="actList" placeholder="例：全通路餐飲"><datalist id="actList"></datalist></div>
<div><label class="f" for="q_goal">活動目標</label><select id="q_goal"><option>流量</option><option>銷售</option><option>名單</option><option>品牌認知</option><option>互動</option></select></div>
<div><label class="f" for="q_aud">受眾</label><textarea id="q_aud" placeholder="例：餐飲業老闆、店長（人手不夠、想用 AI 省力）"></textarea></div>
<div><label class="f" for="q_prod">產品／服務</label><textarea id="q_prod" placeholder="例：免費 30 小時 AI 餐飲培訓班"></textarea></div>
<div><label class="f" for="q_url">到達網址</label><input id="q_url" placeholder="https://"></div>
<div><label class="f" for="q_n">組數</label><input id="q_n" type="number" min="1" max="5" value="3"></div>
</div>
<label class="f" for="q_note">補充說明（方向、這次活動才有的內容，例如日期）</label><textarea id="q_note"></textarea>
<div class="actions"><button class="primary" id="genBtn">產生文案</button><span id="status"></span></div>
<div id="recentBox" class="hidden"><h2 style="margin-top:20px">最近的需求</h2><table><thead><tr><th>需求編號</th><th>活動</th><th>操作者</th><th>狀態</th><th></th></tr></thead><tbody id="recentRows"></tbody></table></div>
</div>
</section>

<section id="resultBox" class="hidden">
<h2 id="resultTitle"></h2>
<p class="muted">確認與修改請到工作 Sheet 的「產出」分頁。紅字【待確認】要補上真實內容；「需確認」是設定和需求裡沒寫到、AI 自己加的事實，請核對。</p>
<div id="sets"></div>
</section>
</main>
<div id="toast"></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbwwcmgtJHsrTcEy4daGkHAbivWoMC0WrERN-gV6tnEVgPdQn7GP3CxuFHlHAOmSlrPD3Q/exec';
var CLIENT_ID = '226548623145-jts9mnei1saeue2rnv529h0dsfmnvlpo.apps.googleusercontent.com';
var token = '', me = null, cur = null;
function $(id) { return document.getElementById(id); }
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(function () { el.classList.remove('on'); }, 1500); }
function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }

function api(params, post) {
  var p = Object.assign({ idToken: token }, params);
  var req = post ? fetch(API, { method: 'POST', body: JSON.stringify(p) })
    : fetch(API + '?' + Object.keys(p).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(p[k]); }).join('&'));
  return req.then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok && d.needLogin) { logout(d.error); throw new Error(d.error); }
    if (!d.ok) throw new Error(d.error || '發生錯誤');
    return d;
  });
}

function expired(t) {
  try { var p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.exp * 1000 < Date.now() + 60000; } catch (e) { return true; }
}

function gsiReady() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: function (r) { token = r.credential; store('adc_t', token); loadMe(); }, auto_select: true });
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' });
  var t = store('adc_t');
  if (t && !expired(t)) { token = t; loadMe(); } else { show('loginBox', true); google.accounts.id.prompt(); }
}

function logout(msg) {
  token = ''; me = null; cur = null; store('adc_t', null);
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  ['who', 'clientsBox', 'workBox', 'resultBox'].forEach(function (id) { show(id, false); });
  show('loginBox', true);
  $('loginMsg').textContent = msg || '';
}
$('logoutBtn').addEventListener('click', function () { logout(''); });

function loadMe() {
  $('loginMsg').textContent = '登入中…';
  api({ action: 'me' }).then(function (d) {
    me = d;
    $('whoName').textContent = d.name + '（' + d.role + '）';
    show('who', true); show('loginBox', false); show('clientsBox', true);
    $('adminNote').textContent = d.admin ? '你是管理者，看得到全部客戶。負責人與確認者的分派請到總表的「客戶清單」調整。' : '只會列出你負責或要確認的客戶。';
    var tb = $('clientRows'); tb.innerHTML = '';
    d.clients.forEach(function (c) {
      var tr = document.createElement('tr'); tr.dataset.name = c.name;
      [c.name, c.meta || '—', c.google || '—', c.reviewer || '—'].forEach(function (v) { tr.appendChild(el('td', v)); });
      var td = document.createElement('td');
      if (c.sheet) { var a = el('a', '開啟 ↗'); a.href = c.sheet; a.target = '_blank'; a.rel = 'noopener'; td.appendChild(a); } else td.appendChild(el('span', '未建立', 'muted'));
      tr.appendChild(td);
      var td2 = document.createElement('td'); var b = el('button', '選擇', 'small'); b.addEventListener('click', function () { selectClient(c.name); }); td2.appendChild(b); tr.appendChild(td2);
      tb.appendChild(tr);
    });
  }).catch(function (e) { $('loginMsg').textContent = e.message; });
}

function selectClient(name) {
  cur = name;
  Array.prototype.forEach.call(document.querySelectorAll('#clientRows tr'), function (tr) { tr.classList.toggle('sel', tr.dataset.name === name); });
  show('workBox', true); show('resultBox', false);
  $('curName').textContent = name + '　讀取中…';
  api({ action: 'client', client: name }).then(function (d) {
    $('curName').textContent = name;
    show('noSheet', !d.hasSheet); show('clientDetail', d.hasSheet);
    if (!d.hasSheet) return;
    $('sheetLink').href = d.sheet;
    var dl = $('settings'); dl.innerHTML = '';
    ['品牌語氣', '必提賣點', '禁用字詞', '備註'].forEach(function (k) { dl.appendChild(el('dt', k)); dl.appendChild(el('dd', d.settings[k] || '（未填）')); });
    var rc = d.refCounts || {};
    $('refInfo').textContent = '參考資料：' + (Object.keys(rc).map(function (k) { return k + ' ' + rc[k]; }).join('、') || '無');
    var dlist = $('actList'); dlist.innerHTML = '';
    (d.activities || []).forEach(function (a) { var o = document.createElement('option'); o.value = a; dlist.appendChild(o); });
    var rb = $('recentRows'); rb.innerHTML = '';
    (d.recent || []).forEach(function (r) {
      var tr = document.createElement('tr');
      [r['需求編號'] || '—', r['活動名稱'] || '—', r['操作者'] || '—', r['狀態'] || '待產'].forEach(function (v) { tr.appendChild(el('td', v)); });
      var td = document.createElement('td');
      if (r['需求編號']) { var b = el('button', '查看', 'small'); b.addEventListener('click', function () { loadResults(r['需求編號']); }); td.appendChild(b); }
      tr.appendChild(td); rb.appendChild(tr);
    });
    show('recentBox', (d.recent || []).length > 0);
    $('workBox').scrollIntoView({ behavior: 'smooth' });
  }).catch(function (e) { $('curName').textContent = name + '　讀取失敗：' + e.message; });
}

function val(id) { return $(id).value.trim(); }
$('genBtn').addEventListener('click', function () {
  if (!cur) return;
  if (!val('q_aud')) { $('status').textContent = '請填受眾'; return; }
  var req = { '平台': $('q_pf').value, '格式': $('q_fmt').value, '活動名稱': val('q_act'), '活動目標': $('q_goal').value, '受眾': val('q_aud'), '產品／服務': val('q_prod'), '到達網址': val('q_url'), '組數': val('q_n') || '3', '補充說明': val('q_note') };
  var t0 = Date.now(), btn = $('genBtn');
  btn.disabled = true;
  var timer = setInterval(function () { $('status').textContent = '產生中，已經 ' + Math.round((Date.now() - t0) / 1000) + ' 秒（通常 1–3 分鐘，AI 忙線時會自動重試）'; }, 1000);
  api({ action: 'generate', client: cur, request: req }, true).then(function (d) {
    $('status').textContent = '完成，花了 ' + Math.round((Date.now() - t0) / 1000) + ' 秒';
    renderResults(d);
    selectClient(cur);
  }).catch(function (e) { $('status').textContent = '失敗：' + e.message; })
    .then(function () { clearInterval(timer); btn.disabled = false; });
});

function loadResults(id) {
  api({ action: 'results', client: cur, id: id }).then(renderResults).catch(function (e) { toast(e.message); });
}

function highlight(box, text) {
  String(text || '').split(/(【待確認[^】]*】)/).forEach(function (part) {
    if (!part) return;
    if (/^【待確認/.test(part)) box.appendChild(el('span', part, 'pending')); else box.appendChild(document.createTextNode(part));
  });
}

function copy(text) {
  var done = function () { toast('已複製'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗'); } document.body.removeChild(ta); }
}

function tsvCell(s) { s = String(s || ''); return /[\t\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

function renderResults(d) {
  show('resultBox', true);
  $('resultTitle').textContent = '產出結果　' + (d.id || '');
  var box = $('sets'); box.innerHTML = '';
  if (!d.rows || !d.rows.length) { box.appendChild(el('p', '沒有產出資料', 'muted')); return; }
  d.rows.forEach(function (r) {
    var s = el('div', null, 'set');
    var head = el('div', null, 'head');
    var left = el('div');
    left.appendChild(el('strong', '第 ' + r['序號'] + ' 組　'));
    left.appendChild(el('span', 'CTA：' + (r['CTA'] || '—'), 'badge'));
    left.appendChild(el('span', '字數 ' + r['字數（文案／標題／說明）'], 'badge'));
    if (r['是否超限']) left.appendChild(el('span', '超限：' + r['是否超限'], 'badge warn'));
    if (r['審核警示']) left.appendChild(el('span', r['審核警示'], 'badge warn'));
    head.appendChild(left);
    var all = el('button', '全部複製（Tab 分隔）', 'small');
    all.addEventListener('click', function () { copy([r['文案'], r['標題'], r['說明'], r['CTA'], r['到達網址']].map(tsvCell).join('\t')); });
    head.appendChild(all);
    s.appendChild(head);
    [['文案', r['文案']], ['標題', r['標題']], ['說明', r['說明']], ['到達網址', r['到達網址']]].forEach(function (f) {
      if (f[0] === '到達網址' && !f[1]) return;
      var fd = el('div', null, 'field'), lbl = el('div', null, 'lbl');
      lbl.appendChild(el('span', f[0]));
      var b = el('button', '複製', 'small'); b.addEventListener('click', function () { copy(f[1]); }); lbl.appendChild(b);
      fd.appendChild(lbl);
      var tx = el('div', null, 'txt'); highlight(tx, f[1]); fd.appendChild(tx);
      s.appendChild(fd);
    });
    box.appendChild(s);
  });
  $('resultBox').scrollIntoView({ behavior: 'smooth' });
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gsiReady()"></script>
</body>
</html>
