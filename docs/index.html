<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theberly 文案產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--muted:#6b7785;--line:#e3e7ec;--accent:#2f6f5e;--accent-weak:#e6f1ed;--warn:#b54708;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{max-width:880px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:15px;margin:0 0 12px;display:flex;gap:8px;align-items:center}
h2 .n{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
select,input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.group{margin-bottom:14px}
.group b{font-size:13px;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px;user-select:none}
.chips input{margin-right:6px}
.chips label:has(input:checked){background:var(--accent-weak);border-color:var(--accent)}
.hidden{display:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:9px 18px;border-radius:6px;border:1px solid var(--accent);cursor:pointer}
.primary{background:var(--accent);color:#fff}
.ghost{background:#fff;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--warn);font-size:13px}
.badge{font-size:12px;background:#fff4e5;color:var(--warn);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:400}
#previewTable{width:100%;border-collapse:collapse;font-size:14px}
#previewTable th{text-align:left;width:140px;color:var(--muted);font-weight:500;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
#previewTable td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:pre-wrap}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.assets label{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.assets label:has(input:checked){background:var(--accent-weak);border-color:var(--accent)}
.assets span{font-size:14px}
.assets small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.assets label.later{opacity:.55;cursor:not-allowed}
.tag{font-size:11px;background:#eef0f3;color:var(--muted);border-radius:4px;padding:0 5px;margin-left:4px}
.aud{margin-top:12px}
.audrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.audrow .audName{flex:1}
.audrow .cnt{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
.audrow .audCnt{width:56px;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit}
button.small{padding:5px 12px;font-size:14px}
button.x{padding:4px 10px}
.keyrow{display:flex;gap:8px}
#clientInfo{margin-top:12px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
#clientInfo a{color:var(--accent)}
</style>
</head>
<body>
<header>
<h1>theberly 文案產生器<span class="badge">骨架版・尚未接 AI</span></h1>
<p>選客戶 → 勾格式 → 填需求 → 產出寫入 Google Sheet，由 Keani／Kimberly 確認</p>
</header>
<main>
<section>
<h2><span class="n">1</span>客戶與需求類型</h2>
<div class="grid2">
<div><label class="f" for="client">客戶</label>
<select id="client"><option value="">載入中…</option></select></div>
<div><label class="f" for="mode">需求類型</label>
<select id="mode">
<option value="全新文案">全新文案</option>
<option value="依過往資料延伸">依過往資料延伸</option>
<option value="改寫既有文案">改寫既有文案</option>
</select></div>
</div>
<div id="keyBox" class="hidden"><label class="f" for="keyInput">通行碼（第一次使用需輸入，向 Keani 索取）</label><div class="keyrow"><input type="text" id="keyInput"><button type="button" class="ghost small" id="keyBtn">確認</button></div><p class="note" id="keyMsg"></p></div>
<div id="clientInfo" class="hidden"></div>
<div id="noteBox" class="hidden"><label class="f" for="clientNote">客戶備註（從客戶設定帶入，可修改）</label><textarea id="clientNote"></textarea></div>
<div id="newClientBox" class="hidden"><label class="f" for="newClient">新客戶名稱</label><input type="text" id="newClient" placeholder="例：某某品牌"></div>
<div id="pastBox" class="hidden"><label class="f" for="past">貼上過往資料（舊文案、成效好的標題等）</label><textarea id="past"></textarea></div>
</section>

<section>
<h2><span class="n">2</span>要產哪些格式</h2>
<div class="group"><b>Google</b><div class="chips">
<label><input type="checkbox" name="fmt" value="Google 搜尋 RSA">搜尋 RSA（標題×15、描述×4）</label>
<label><input type="checkbox" name="fmt" value="Google PMax">PMax（短標題、長標題、描述）</label>
</div></div>
<div class="group"><b>Google 廣告素材資源</b><div class="assets">
<label class="later"><input type="checkbox" name="fmt" value="圖片" disabled><span>圖片<span class="tag">第二階段</span><small>廣告圖片</small></span></label>
<label><input type="checkbox" name="fmt" value="商家名稱"><span>商家名稱<small>品牌名稱，例：創創數位科技</small></span></label>
<label class="later"><input type="checkbox" name="fmt" value="商家標誌" disabled><span>商家標誌<span class="tag">第二階段</span><small>品牌 logo</small></span></label>
<label><input type="checkbox" name="fmt" value="網站連結"><span>網站連結<small>廣告下方可點的連結，例：課程介紹、學員見證</small></span></label>
<label><input type="checkbox" name="fmt" value="標題"><span>標題<small>帳戶／活動層級共用的標題</small></span></label>
<label><input type="checkbox" name="fmt" value="說明"><span>說明<small>帳戶／活動層級共用的說明</small></span></label>
<label><input type="checkbox" name="fmt" value="文字免責事項"><span>文字免責事項<small>注意事項短句，例：實際優惠以官網公告為準</small></span></label>
<label><input type="checkbox" name="fmt" value="摘要"><span>摘要<small>講好處的短句，例：免費諮詢、新會員折扣</small></span></label>
<label><input type="checkbox" name="fmt" value="網站簡介"><span>網站簡介<small>分類＋項目，例：課程：SBIR、SIIR、CITD</small></span></label>
<label><input type="checkbox" name="fmt" value="電話"><span>電話<span class="tag">只填欄位</span><small>客服電話</small></span></label>
<label><input type="checkbox" name="fmt" value="待開發客戶表單"><span>待開發客戶表單<small>名單表單的標題、說明、問題</small></span></label>
<label><input type="checkbox" name="fmt" value="訊息"><span>訊息<small>點了直接傳訊息的開場文字</small></span></label>
<label><input type="checkbox" name="fmt" value="地區"><span>地區<span class="tag">只填欄位</span><small>門市地址</small></span></label>
<label><input type="checkbox" name="fmt" value="價格"><span>價格<small>品項＋價格，例：衝刺班 $899 起</small></span></label>
<label><input type="checkbox" name="fmt" value="應用程式"><span>應用程式<span class="tag">只填欄位</span><small>App 下載連結</small></span></label>
<label><input type="checkbox" name="fmt" value="宣傳"><span>宣傳<small>活動優惠，例：雙 11 全館 85 折</small></span></label>
</div></div>
<div class="group"><b>Meta</b><div class="chips">
<label><input type="checkbox" name="fmt" value="Meta 廣告">主要文字、標題、描述</label>
</div></div>
</section>

<section>
<h2><span class="n">3</span>需求內容</h2>
<div class="grid2">
<div><label class="f" for="product">產品／服務</label><textarea id="product"></textarea></div>
<div><label class="f" for="goal">活動目標</label><textarea id="goal" placeholder="例：導購、名單、品牌認知"></textarea></div>
<div><label class="f" for="tone">品牌語氣</label><textarea id="tone"></textarea></div>
<div><label class="f" for="usp">必提賣點</label><textarea id="usp"></textarea></div>
<div><label class="f" for="banned">禁用字詞</label><textarea id="banned" placeholder="用頓號或換行分隔"></textarea></div>
</div>
<div class="aud"><label class="f">受眾（每個受眾各產一套）</label>
<div id="audList"></div>
<button type="button" class="ghost small" id="addAud">＋ 新增受眾</button></div>
<div class="chips" style="margin-top:12px"><label><input type="checkbox" id="history" checked>參考歷史成效（Google＋Meta）</label></div>
</section>

<section>
<div class="actions">
<button class="ghost" id="previewBtn">預覽輸入</button>
<button class="primary" disabled>產生文案</button>
<span class="note">AI 尚未接上，目前只能預覽輸入內容</span>
</div>
</section>

<section id="previewBox" class="hidden">
<h2>輸入預覽（不會寫入 Sheet）</h2>
<table id="previewTable"></table>
</section>
</main>
<script>
var $ = function (id) { return document.getElementById(id); };
function toggle() {
  var isNew = $('client').value === '__new';
  $('newClientBox').classList.toggle('hidden', !isNew);
  $('pastBox').classList.toggle('hidden', $('mode').value === '全新文案');
  $('history').disabled = isNew;
  if (isNew) $('history').checked = false;
}
$('client').addEventListener('change', toggle);
$('mode').addEventListener('change', toggle);
function val(id, empty) { var v = $(id).value.trim(); return v || empty; }
$('previewBtn').addEventListener('click', function () {
  var c = $('client').value;
  var name = c === '__new' ? val('newClient', '（未填名稱）') + '（新客戶）' : (c || '（未選）');
  var fmts = Array.prototype.map.call(document.querySelectorAll('input[name="fmt"]:checked'), function (i) { return i.value; });
  var rows = [['客戶', name], ['需求類型', $('mode').value]];
  if ($('mode').value !== '全新文案') rows.push(['過往資料', val('past', '（空）')]);
  rows.push(['勾選格式', fmts.length ? fmts.join('、') : '（未勾選）']);
  var auds = Array.prototype.map.call(document.querySelectorAll('.audrow'), function (r, i) { return '受眾 ' + (i + 1) + '：' + (r.querySelector('.audName').value.trim() || '（未填）') + '｜' + r.querySelector('.audCnt').value + ' 組'; });
  rows.push(['受眾', auds.join('\n')]);
  [['產品／服務', 'product'], ['活動目標', 'goal'], ['品牌語氣', 'tone'], ['必提賣點', 'usp'], ['禁用字詞', 'banned'], ['客戶備註', 'clientNote']].forEach(function (r) { rows.push([r[0], val(r[1], '（空）')]); });
  rows.push(['參考歷史成效', $('history').checked ? '是' : '否']);
  var t = $('previewTable'); t.innerHTML = '';
  rows.forEach(function (r) {
    var tr = document.createElement('tr'), th = document.createElement('th'), td = document.createElement('td');
    th.textContent = r[0]; td.textContent = r[1]; tr.appendChild(th); tr.appendChild(td); t.appendChild(tr);
  });
  $('previewBox').classList.remove('hidden');
  $('previewBox').scrollIntoView({ behavior: 'smooth' });
});
function addAud() {
  var row = document.createElement('div'); row.className = 'audrow';
  row.innerHTML = '<input type="text" class="audName" placeholder="例：40–55 歲中小企業主、北部"><label class="cnt">組數 <input type="number" class="audCnt" min="1" max="5" value="1"></label><button type="button" class="ghost x" aria-label="刪除">×</button>';
  row.querySelector('.x').addEventListener('click', function () { if ($('audList').children.length > 1) row.remove(); });
  $('audList').appendChild(row);
}
$('addAud').addEventListener('click', addAud);
addAud();
var API = 'https://script.google.com/macros/s/AKfycbwwcmgtJHsrTcEy4daGkHAbivWoMC0WrERN-gV6tnEVgPdQn7GP3CxuFHlHAOmSlrPD3Q/exec';
var CLIENTS = [];
function getKey() { try { return localStorage.getItem('adc_key') || ''; } catch (e) { return ''; } }
function setKey(k) { try { localStorage.setItem('adc_key', k); } catch (e) {} }
function opt(v, t) { var o = document.createElement('option'); o.value = v; o.textContent = t; return o; }
function fillSelect(list) {
  var s = $('client'); s.innerHTML = '';
  s.appendChild(opt('', '請選擇'));
  list.forEach(function (c) { s.appendChild(opt(c['客戶名稱'], c['客戶名稱'])); });
  s.appendChild(opt('__new', '＋ 新客戶'));
}
function loadClients(key) {
  $('keyMsg').textContent = '讀取中…';
  fetch(API + '?action=clients&key=' + encodeURIComponent(key)).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { $('keyBox').classList.remove('hidden'); $('keyMsg').textContent = d.error || '讀取失敗'; fillSelect([]); return; }
    setKey(key); $('keyBox').classList.add('hidden'); $('keyMsg').textContent = '';
    CLIENTS = d.clients || []; fillSelect(CLIENTS);
  }).catch(function (e) { $('keyBox').classList.remove('hidden'); $('keyMsg').textContent = '連線失敗：' + e.message; fillSelect([]); });
}
function applyClient() {
  var c = CLIENTS.filter(function (x) { return x['客戶名稱'] === $('client').value; })[0];
  var info = $('clientInfo'); info.innerHTML = '';
  ['tone', 'usp', 'banned', 'clientNote'].forEach(function (id) { $(id).value = ''; });
  if (!c) { info.classList.add('hidden'); $('noteBox').classList.add('hidden'); return; }
  $('tone').value = c['品牌語氣'] || ''; $('usp').value = c['必提賣點'] || ''; $('banned').value = c['禁用字詞'] || ''; $('clientNote').value = c['備註'] || '';
  [['Google 帳號', c['Google 帳號 ID']], ['Meta 帳號', c['Meta 帳號 ID']]].forEach(function (p) {
    var sp = document.createElement('span'); sp.textContent = p[0] + '：' + (p[1] || '（未填）'); info.appendChild(sp);
  });
  [['Meta 進稿表', c['Meta 進稿表連結']], ['Google 進稿表', c['Google 進稿表連結']], ['素材資料夾', c['素材資料夾連結']]].forEach(function (p) {
    var el;
    if (p[1] && /^https:\/\//.test(p[1])) { el = document.createElement('a'); el.href = p[1]; el.target = '_blank'; el.rel = 'noopener'; el.textContent = p[0] + ' ↗'; }
    else { el = document.createElement('span'); el.textContent = p[0] + '：（未填）'; }
    info.appendChild(el);
  });
  info.classList.remove('hidden'); $('noteBox').classList.remove('hidden');
}
$('client').addEventListener('change', applyClient);
$('keyBtn').addEventListener('click', function () { var k = $('keyInput').value.trim(); if (k) loadClients(k); });
(function () { var k = getKey(); if (k) loadClients(k); else { fillSelect([]); $('keyBox').classList.remove('hidden'); } })();
</script>
</body>
</html>
