<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theberly 文案產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--panel:#fff;--ink:#2b2f2c;--muted:#7b827d;--line:#e4e5e0;--accent:#5b7262;--accent-2:#4a5f51;--accent-weak:#eaf0ec;--head:#5f7466;--star:#f0b23e;--red:#bf4a52;--red-bg:#fbecee;--amber:#a2661b;--amber-bg:#fdf3e2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:14px;line-height:1.6}
.top{height:56px;background:var(--head);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-family:'Noto Serif TC',serif;font-weight:700;font-size:18px;display:flex;align-items:baseline;gap:6px}
.brand .star{color:var(--star);font-size:15px}
.brand .bsub{font-family:'Noto Sans TC',sans-serif;font-weight:400;font-size:12px;color:#d9e2dc;margin-left:6px}
#who{display:flex;gap:10px;align-items:center;color:#e6ece8;font-size:13px}
#who button{background:transparent;color:#fff;border-color:#c9d4cd}
#who button:hover{background:rgba(255,255,255,.12)}
.hidden{display:none!important}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
button:hover{background:var(--accent-weak)}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-2)}
button.small{padding:2px 10px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
#login{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;text-align:center}
#login h2{margin:0 0 6px;font-size:18px;font-family:'Noto Serif TC',serif}
#loginMsg{color:var(--red);min-height:22px}
#gbtn{display:flex;justify-content:center;margin:18px 0 8px}
.app{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 56px)}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:14px 14px 8px}
.search input{width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:#fafaf8;font:inherit}
#clientList{list-style:none;margin:0;padding:4px 8px;overflow:auto;flex:1}
#clientList li{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:3px solid transparent}
#clientList li:hover{background:#f3f5f2}
#clientList li.sel{background:var(--accent-weak);border-left-color:var(--accent)}
#clientList .nm{font-weight:500}
#clientList .sub{font-size:12px;color:var(--muted)}
.pill{font-size:11px;border-radius:999px;padding:0 8px;background:var(--amber-bg);color:var(--amber);font-weight:700;white-space:nowrap}
.pill.none{background:transparent;color:#a9afaa;font-weight:400;border:1px solid var(--line)}
.adminBox{border-top:1px solid var(--line);padding:12px 16px;font-size:13px}
.adminBox .ttl{color:var(--muted);font-size:12px;margin-bottom:4px}
.adminBox a,.adminBox span{display:block;padding:3px 0;text-decoration:none}
.adminBox span{color:#a9afaa}
.main{overflow:auto;min-height:0}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chead{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px 0}
.chead h2{margin:0;font-size:20px;font-family:'Noto Serif TC',serif}
.chead .meta{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:2px;margin-top:12px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);padding:8px 14px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tabs button:hover{background:none;color:var(--ink)}
.panel{padding:20px 24px}
.gen{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.gen{grid-template-columns:1fr}.app{grid-template-columns:1fr;height:auto}aside{max-height:260px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
label.f:first-child{margin-top:0}
select,input,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:56px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#status{font-size:13px;color:var(--amber);margin-top:8px;min-height:20px}
.ph{color:var(--muted);text-align:center;padding:48px 16px;border:1px dashed #d6d8d2;border-radius:10px;background:var(--panel)}
.set{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.set .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:1px 7px;margin-right:4px;background:var(--accent-weak);color:var(--accent)}
.badge.warn{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.field{margin-top:8px}
.field .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.field .txt{white-space:pre-wrap;background:#fafaf8;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:3px}
.pending{color:var(--red);font-weight:700;background:var(--red-bg);border-radius:3px;padding:0 2px}
.resHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.resHead h3{margin:0;font-size:15px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--line);padding:8px 10px;background:#fafaf8}
td{border-bottom:1px solid var(--line);padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chips button{border-radius:999px;padding:3px 12px;font-size:13px;border-color:var(--line);color:var(--muted)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips input{max-width:240px;margin-left:auto}
.ref{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ref .c{white-space:pre-wrap;margin-top:6px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ref .c.open{display:block}
dl{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;margin:0}
dt{color:var(--muted)}dd{margin:0;white-space:pre-wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2f2c;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="top"><div class="brand">文案產生器<span class="star">✳</span><span class="bsub">theberly</span></div><div id="who" class="hidden"><span id="whoName"></span><button class="small" id="logoutBtn">登出</button></div></div>

<div id="login">
<h2>登入</h2>
<p class="muted">請用總表「人員」分頁登記的 Google 帳號登入</p>
<div id="gbtn"></div>
<p id="loginMsg"></p>
</div>

<div id="app" class="app hidden">
<aside>
<div class="search"><input id="q" placeholder="搜尋客戶"></div>
<ul id="clientList"></ul>
<div class="adminBox hidden" id="adminBox">
<div class="ttl">管理</div>
<span>＋ 新客戶（下一步）</span>
<a href="https://docs.google.com/spreadsheets/d/1sNi-8OQDg3NtoBVM11Y65IpF-nNy0F1ZtJUivLZD3sY/edit" target="_blank" rel="noopener">人員與分派（總表）↗</a>
</div>
</aside>

<div class="main">
<div class="empty" id="emptyView">← 從左邊選一個客戶</div>
<div id="clientView" class="hidden">
<div class="chead">
<h2 id="cName"></h2>
<div class="meta" id="cMeta"></div>
<div class="tabs" id="tabs"><button data-tab="gen" class="on">產生文案</button><button data-tab="hist">產出紀錄</button><button data-tab="refs">參考資料</button><button data-tab="set">設定</button></div>
</div>

<div class="panel" id="noSheet"><div class="ph">這個客戶還沒有工作 Sheet，請 Keani 或 Kimberly 先建立。</div></div>

<div class="panel tab" data-tab="gen">
<div class="gen">
<div class="card">
<div class="row2">
<div><label class="f" for="q_pf">平台</label><select id="q_pf"><option>Meta</option><option>Google</option></select></div>
<div><label class="f" for="q_fmt">格式</label><select id="q_fmt"><option>Meta 廣告</option><option>Google RSA</option></select></div>
</div>
<label class="f" for="q_act">活動名稱</label><input id="q_act" list="actList" placeholder="例：全通路餐飲"><datalist id="actList"></datalist>
<label class="f" for="q_aud">受眾 *</label><textarea id="q_aud" placeholder="例：餐飲業老闆、店長（人手不夠、想用 AI 省力）"></textarea>
<label class="f" for="q_prod">產品／服務</label><textarea id="q_prod" placeholder="例：免費 30 小時 AI 餐飲培訓班"></textarea>
<div class="row2">
<div><label class="f" for="q_goal">活動目標</label><select id="q_goal"><option>流量</option><option>銷售</option><option>名單</option><option>品牌認知</option><option>互動</option></select></div>
<div><label class="f" for="q_n">組數</label><input id="q_n" type="number" min="1" max="5" value="3"></div>
</div>
<label class="f" for="q_url">到達網址</label><input id="q_url" placeholder="https://">
<label class="f" for="q_note">補充說明（方向、這次才有的內容）</label><textarea id="q_note"></textarea>
<div style="margin-top:14px"><button class="primary" id="genBtn" style="width:100%">產生文案</button></div>
<div id="status"></div>
</div>
<div id="genResult"><div class="ph">產出會顯示在這裡<br><span class="muted">紅字【待確認】要補真實內容；「需確認」是設定和需求沒寫、AI 自己加的事實</span></div></div>
</div>
</div>

<div class="panel tab hidden" data-tab="hist">
<table><thead><tr><th>需求編號</th><th>活動</th><th>格式</th><th>操作者</th><th>建立時間</th><th>狀態</th><th></th></tr></thead><tbody id="histRows"></tbody></table>
<div id="histResult" style="margin-top:16px"></div>
</div>

<div class="panel tab hidden" data-tab="refs">
<div class="chips" id="refChips"><button data-t="" class="on">全部</button><button data-t="成效好">成效好</button><button data-t="客戶提供">客戶提供</button><button data-t="僅供參考">僅供參考</button><input id="refQ" placeholder="搜尋內容或活動"></div>
<div id="refList"><div class="ph">讀取中…</div></div>
</div>

<div class="panel tab hidden" data-tab="set">
<div class="card"><dl id="settings"></dl><p class="muted" style="margin-bottom:0">要修改請到工作 Sheet 的「設定」分頁，網頁會直接讀最新內容。</p></div>
</div>
</div>
</div>
</div>
<div id="toast"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwwcmgtJHsrTcEy4daGkHAbivWoMC0WrERN-gV6tnEVgPdQn7GP3CxuFHlHAOmSlrPD3Q/exec';
var CLIENT_ID = '226548623145-jts9mnei1saeue2rnv529h0dsfmnvlpo.apps.googleusercontent.com';
var token = '', me = null, cur = null, curData = null, refRows = null, refType = '';
function $(id) { return document.getElementById(id); }
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(function () { e.classList.remove('on'); }, 1500); }
function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }

function api(params, post) {
  var p = Object.assign({ idToken: token }, params);
  var req = post ? fetch(API, { method: 'POST', body: JSON.stringify(p) })
    : fetch(API + '?' + Object.keys(p).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(p[k]); }).join('&'));
  return req.then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok && d.needLogin) { logout(d.error); throw new Error(d.error); }
    if (!d.ok) throw new Error(d.error || '發生錯誤');
    return d;
  });
}
function expired(t) { try { var p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.exp * 1000 < Date.now() + 60000; } catch (e) { return true; } }

function gsiReady() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: function (r) { token = r.credential; store('adc_t', token); loadMe(); }, auto_select: true });
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' });
  var t = store('adc_t');
  if (t && !expired(t)) { token = t; loadMe(); } else google.accounts.id.prompt();
}
function logout(msg) {
  token = ''; me = null; cur = null; store('adc_t', null);
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  show('app', false); show('who', false); show('login', true);
  $('loginMsg').textContent = msg || '';
}
$('logoutBtn').addEventListener('click', function () { logout(''); });

function loadMe() {
  $('loginMsg').textContent = '登入中…';
  api({ action: 'me' }).then(function (d) {
    me = d;
    $('whoName').textContent = d.name + '（' + d.role + '）';
    show('login', false); show('who', true); show('app', true); show('adminBox', d.admin);
    renderList();
  }).catch(function (e) { $('loginMsg').textContent = e.message; });
}

function renderList() {
  var q = $('q').value.trim(), ul = $('clientList'); ul.innerHTML = '';
  me.clients.filter(function (c) { return !q || c.name.indexOf(q) >= 0; }).forEach(function (c) {
    var li = el('li'); if (c.name === cur) li.classList.add('sel');
    var l = el('div'); l.appendChild(el('div', c.name, 'nm'));
    li.appendChild(l);
    if (!c.sheet) li.appendChild(el('span', '未建立', 'pill none'));
    else if (Number(c.pending) > 0) li.appendChild(el('span', c.pending, 'pill'));
    li.addEventListener('click', function () { selectClient(c.name); });
    ul.appendChild(li);
  });
}
$('q').addEventListener('input', renderList);

function setTab(t) {
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.dataset.tab === t); });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (p) { p.classList.toggle('hidden', !curData || !curData.hasSheet || p.dataset.tab !== t); });
  if (t === 'refs' && curData && curData.hasSheet && !refRows) loadRefs();
}
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });

function selectClient(name) {
  cur = name; curData = null; refRows = null; renderList();
  var c = me.clients.find(function (x) { return x.name === name; }) || {};
  show('emptyView', false); show('clientView', true); show('noSheet', false);
  $('cName').textContent = name;
  $('cMeta').textContent = '讀取中…';
  $('genResult').innerHTML = '<div class="ph">產出會顯示在這裡<br><span class="muted">紅字【待確認】要補真實內容；「需確認」是設定和需求沒寫、AI 自己加的事實</span></div>';
  $('histResult').innerHTML = ''; $('status').textContent = '';
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (p) { p.classList.add('hidden'); });
  api({ action: 'client', client: name }).then(function (d) {
    if (cur !== name) return;
    curData = d;
    var meta = el('span', ['Meta：' + (c.meta || '—'), 'Google：' + (c.google || '—'), '確認者：' + (c.reviewer || '—')].join('　') + '　');
    $('cMeta').innerHTML = ''; $('cMeta').appendChild(meta);
    show('noSheet', !d.hasSheet);
    if (!d.hasSheet) return;
    var a = el('a', '開啟工作 Sheet ↗'); a.href = d.sheet; a.target = '_blank'; a.rel = 'noopener'; $('cMeta').appendChild(a);
    var dl = $('actList'); dl.innerHTML = '';
    (d.activities || []).forEach(function (x) { var o = document.createElement('option'); o.value = x; dl.appendChild(o); });
    var sd = $('settings'); sd.innerHTML = '';
    ['品牌語氣', '必提賣點', '禁用字詞', '備註', 'Meta 帳號 ID', 'Google 帳號 ID'].forEach(function (k) { sd.appendChild(el('dt', k)); sd.appendChild(el('dd', d.settings[k] || '（未填）')); });
    renderHist(d.recent || []);
    setTab(document.querySelector('#tabs button.on').dataset.tab);
  }).catch(function (e) { $('cMeta').textContent = '讀取失敗：' + e.message; });
}

function renderHist(rows) {
  var tb = $('histRows'); tb.innerHTML = '';
  if (!rows.length) { var tr = el('tr'); var td = el('td', '還沒有需求', 'muted'); td.colSpan = 7; tr.appendChild(td); tb.appendChild(tr); return; }
  rows.forEach(function (r) {
    var tr = el('tr');
    [r['需求編號'] || '—', r['活動名稱'] || '—', r['格式'] || '—', r['操作者'] || '—', r['建立時間'] || '—', r['狀態'] || '待產'].forEach(function (v) { tr.appendChild(el('td', v)); });
    var td = el('td');
    if (r['需求編號']) { var b = el('button', '查看', 'small'); b.addEventListener('click', function () { $('histResult').innerHTML = '<div class="ph">讀取中…</div>'; api({ action: 'results', client: cur, id: r['需求編號'] }).then(function (d) { renderResults($('histResult'), d); }).catch(function (e) { toast(e.message); }); }); td.appendChild(b); }
    tr.appendChild(td); tb.appendChild(tr);
  });
}

function loadRefs() {
  $('refList').innerHTML = '<div class="ph">讀取中…</div>';
  api({ action: 'refs', client: cur }).then(function (d) { refRows = d.rows; renderRefs(); }).catch(function (e) { $('refList').innerHTML = ''; $('refList').appendChild(el('div', '讀取失敗：' + e.message, 'ph')); });
}
function renderRefs() {
  var box = $('refList'); box.innerHTML = '';
  var q = $('refQ').value.trim();
  var rows = (refRows || []).filter(function (r) { return (!refType || r.type === refType) && (!q || (r.content + r.activity).indexOf(q) >= 0); });
  if (!rows.length) { box.appendChild(el('div', '沒有符合的參考資料', 'ph')); return; }
  rows.forEach(function (r) {
    var d = el('div', null, 'ref');
    var h = el('div');
    h.appendChild(el('span', r.type || '未分類', 'badge' + (r.type === '成效好' ? '' : r.type === '客戶提供' ? ' amber' : '')));
    if (r.platform) h.appendChild(el('span', r.platform, 'badge'));
    if (r.note) h.appendChild(el('span', r.note, 'muted'));
    d.appendChild(h);
    if (r.activity) d.appendChild(el('div', '活動：' + r.activity, 'muted'));
    var c = el('div', r.content, 'c'); c.title = '點一下展開／收合'; c.addEventListener('click', function () { c.classList.toggle('open'); });
    d.appendChild(c);
    box.appendChild(d);
  });
}
Array.prototype.forEach.call(document.querySelectorAll('#refChips button'), function (b) {
  b.addEventListener('click', function () { refType = b.dataset.t; Array.prototype.forEach.call(document.querySelectorAll('#refChips button'), function (x) { x.classList.toggle('on', x === b); }); renderRefs(); });
});
$('refQ').addEventListener('input', renderRefs);

function val(id) { return $(id).value.trim(); }
// 平台與格式連動；Google RSA 一組就有 15 則標題＋4 則說明，組數預設 1
function syncFmt(fromFmt) {
  if (fromFmt) $('q_pf').value = $('q_fmt').value === 'Google RSA' ? 'Google' : 'Meta';
  else $('q_fmt').value = $('q_pf').value === 'Google' ? 'Google RSA' : 'Meta 廣告';
  $('q_n').value = $('q_fmt').value === 'Google RSA' ? '1' : '3';
}
$('q_pf').addEventListener('change', function () { syncFmt(false); });
$('q_fmt').addEventListener('change', function () { syncFmt(true); });
$('genBtn').addEventListener('click', function () {
  if (!cur || !curData || !curData.hasSheet) return;
  if (!val('q_aud')) { $('status').textContent = '請填受眾'; return; }
  var req = { '平台': $('q_pf').value, '格式': $('q_fmt').value, '活動名稱': val('q_act'), '活動目標': $('q_goal').value, '受眾': val('q_aud'), '產品／服務': val('q_prod'), '到達網址': val('q_url'), '組數': val('q_n') || '3', '補充說明': val('q_note') };
  var t0 = Date.now(), btn = $('genBtn'), client = cur;
  btn.disabled = true;
  $('genResult').innerHTML = '<div class="ph">AI 產生中…<br><span class="muted">通常 1–3 分鐘，忙線時會自動重試，可以先去做別的事</span></div>';
  var timer = setInterval(function () { $('status').textContent = '產生中，已經 ' + Math.round((Date.now() - t0) / 1000) + ' 秒'; }, 1000);
  api({ action: 'generate', client: client, request: req }, true).then(function (d) {
    $('status').textContent = '完成，花了 ' + Math.round((Date.now() - t0) / 1000) + ' 秒';
    if (cur === client) { renderResults($('genResult'), d); api({ action: 'client', client: client }).then(function (x) { if (cur === client) { curData = x; renderHist(x.recent || []); } }); }
    api({ action: 'me' }).then(function (m) { me = m; renderList(); });
  }).catch(function (e) {
    $('status').textContent = '失敗：' + e.message;
    $('genResult').innerHTML = ''; $('genResult').appendChild(el('div', '這次沒有產出成功，可以稍等再按一次', 'ph'));
  }).then(function () { clearInterval(timer); btn.disabled = false; });
});

function highlight(box, text) {
  String(text || '').split(/(【待確認[^】]*】)/).forEach(function (part) {
    if (!part) return;
    if (/^【待確認/.test(part)) box.appendChild(el('span', part, 'pending')); else box.appendChild(document.createTextNode(part));
  });
}
function copy(text) {
  var done = function () { toast('已複製'); };
  function fallback() { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗'); } document.body.removeChild(ta); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function tsvCell(s) { s = String(s || ''); return /[\t\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

function renderResults(box, d) {
  box.innerHTML = '';
  var hd = el('div', null, 'resHead'); hd.appendChild(el('h3', '產出結果　' + (d.id || ''))); hd.appendChild(el('span', '確認與修改請到工作 Sheet「產出」分頁', 'muted'));
  box.appendChild(hd);
  if (!d.rows || !d.rows.length) { box.appendChild(el('div', '沒有產出資料', 'ph')); return; }
  d.rows.forEach(function (r) {
    var s = el('div', null, 'set'), head = el('div', null, 'head'), left = el('div');
    left.appendChild(el('strong', '第 ' + r['序號'] + ' 組　'));
    left.appendChild(el('span', r['確認狀態'] || '待確認', 'badge' + (r['確認狀態'] === '已確認' ? '' : ' amber')));
    var rsa = r['格式'] === 'Google RSA';
    if (!rsa) left.appendChild(el('span', 'CTA ' + (r['CTA'] || '—'), 'badge'));
    left.appendChild(el('span', '字數 ' + r['字數（文案／標題／說明）'], 'badge'));
    if (r['是否超限']) left.appendChild(el('span', '超限 ' + r['是否超限'], 'badge warn'));
    String(r['審核警示'] || '').split('、').filter(Boolean).forEach(function (w) { left.appendChild(el('span', w, 'badge warn')); });
    head.appendChild(left);
    var all = el('button', rsa ? '全部複製（標題 1–15、說明 1–4，一列）' : '全部複製（Tab 分隔）', 'small');
    all.addEventListener('click', function () {
      if (rsa) { var hs = String(r['標題'] || '').split('\n'), ds = String(r['說明'] || '').split('\n'), row = [];
        for (var i = 0; i < 15; i++) row.push(hs[i] || ''); for (var j = 0; j < 4; j++) row.push(ds[j] || ''); copy(row.join('\t')); }
      else copy([r['文案'], r['標題'], r['說明'], r['CTA'], r['到達網址']].map(tsvCell).join('\t'));
    });
    head.appendChild(all); s.appendChild(head);
    [['文案', r['文案']], ['標題', r['標題']], ['說明', r['說明']], ['到達網址', r['到達網址']]].forEach(function (f) {
      if ((f[0] === '到達網址' || f[0] === '文案') && !f[1]) return;
      if (rsa && f[1]) {
        var fd2 = el('div', null, 'field'), lbl2 = el('div', null, 'lbl'), lines = String(f[1]).split('\n'), lim = f[0] === '標題' ? 30 : 90;
        lbl2.appendChild(el('span', f[0] + '（' + lines.length + ' 則，上限 ' + lim + ' 半形字元）'));
        var b2 = el('button', '複製', 'small'); b2.addEventListener('click', function () { copy(f[1]); }); lbl2.appendChild(b2);
        fd2.appendChild(lbl2);
        var tx2 = el('div', null, 'txt');
        lines.forEach(function (ln, k) {
          var n = Array.from(ln).reduce(function (a, ch) { return a + (ch.charCodeAt(0) > 0xFF ? 2 : 1); }, 0);
          var d = el('div'); d.appendChild(el('span', (k + 1) + '. ', 'muted')); highlight(d, ln);
          d.appendChild(el('span', '　' + n, n > lim ? 'badge warn' : 'muted'));
          tx2.appendChild(d);
        });
        fd2.appendChild(tx2); s.appendChild(fd2); return;
      }
      var fd = el('div', null, 'field'), lbl = el('div', null, 'lbl');
      lbl.appendChild(el('span', f[0]));
      var b = el('button', '複製', 'small'); b.addEventListener('click', function () { copy(f[1]); }); lbl.appendChild(b);
      fd.appendChild(lbl);
      var tx = el('div', null, 'txt'); highlight(tx, f[1]); fd.appendChild(tx);
      s.appendChild(fd);
    });
    box.appendChild(s);
  });
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gsiReady()"></script>
